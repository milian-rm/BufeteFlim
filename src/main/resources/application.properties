spring.application.name=BufeteFlim

server.port:8090
server.servlet.context-path=/bufeteflim/api

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/DB_BufeteFlim?createDatabaseIfNotExist=true
spring.datasource.username=quintom
spring.datasource.password=admin

langchain4j.open-ai.chat-model.api-key=demo
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true