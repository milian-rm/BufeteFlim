<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            Registro Abogado
        </title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>
    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-gestiones">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-gestiones:tabla-gestiones"
                                    actionListener="#{gestionVistaController.cargarDatos()}"/>
                    </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{gestionVistaController.gestiones}" var="gestion"
                                 id="tabla-gestiones" widgetVar="gestionTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>gestiones</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="TIPO">
                            <h:outputText value="#{gestion.type()}"/>
                        </p:column>
                        <p:column headerText="DESCRIPCION">
                            <h:outputText value="#{gestion.description()}"/>
                        </p:column>
                        <p:column headerText="FECHA CREACION">
                            <h:outputText value="#{gestion.creationDate()}"/>
                        </p:column>
                        <p:column headerText="FECHA VENCIMIENTO">
                            <h:outputText value="#{gestion.expirationDate()}"/>
                        </p:column>
                        <p:column headerText="ESTADO">
                            <h:outputText value="#{gestion.status1()}"/>
                        </p:column>
                        <p:column headerText="OBSERVACIONES">
                            <h:outputText value="#{gestion.observations()}"/>
                        </p:column>
                        <p:column headerText="CASO">
                            <h:outputText value="#{gestion.idCase()}"/>
                        </p:column>
                        <p:column headerText="ABOGADO">
                            <h:outputText value="#{gestion.idLawyer()}"/>
                        </p:column>
                        <p:column headerText="HISTORIAL">
                            <h:outputText value="#{gestion.idRecord()}"/>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
