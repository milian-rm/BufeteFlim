<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Registro Detalle Caso</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>
    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-detalleCasos">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-detalleCasos:tabla-detalleCasos"
                                    actionListener="#{detalleCasoVistaController.cargarDatos()}"/> </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{detalleCasoVistaController.detalleCasos}" var="detalleCasos" id="tabla-detalleCasos" widgetVar="detalleCasoTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>Detalle Casos</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="PARTE">
                            <h:outputText value="#{detalleCasos.idComponent()}"/>
                        </p:column>

                        <p:column headerText="CASO">
                            <h:outputText value="#{detalleCasos.idCase()}"/>
                        </p:column>

                        <p:column headerText="ROL">
                            <h:outputText value="#{detalleCasos.role()}"/>
                        </p:column>

                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
