<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            Registro Caso
        </title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>
    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-historiales">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-historiales:tabla-historiales"
                                    actionListener="#{historialVistaController.cargarDatos()}"/>
                    </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{historialVistaController.historiales}" var="historial"
                                 id="tabla-historiales" widgetVar="casoTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>Historial</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="DESCRIPCIÓN">
                            <h:outputText value="#{historial.description()}"/>
                        </p:column>
                        <p:column headerText="ABOGADO">
                            <h:outputText value="#{historial.idLawyer()}"/>
                        </p:column>
                        <p:column headerText="CASO">
                            <h:outputText value="#{historial.idCase()}"/>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
