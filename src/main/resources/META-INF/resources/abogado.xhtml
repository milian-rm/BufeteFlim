<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            Registro Abogado
        </title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>

    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-abogados">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-abogados:tabla-abogados"
                                    actionListener="#{abogadoVistaController.cargarDatos()}"/>
                    </p:menubar>
                </div>
                <div class="card">
                    <p:dataTable value="#{abogadoVistaController.abogados}" var="abogado"
                                 id="tabla-abogados" widgetVar="abogadoTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>Abogados</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="NOMBRE">
                            <h:outputText value="#{abogado.name()}"/>
                        </p:column>
                        <p:column headerText="APELLIDO">
                            <h:outputText value="#{abogado.lastName()}"/>
                        </p:column>
                        <p:column headerText="DPI">
                            <h:outputText value="#{abogado.dpi1()}"/>
                        </p:column>
                        <p:column headerText="#COLEGIADO_ACTIVO">
                            <h:outputText value="#{abogado.numActiveCollegiate()}"/>
                        </p:column>
                        <p:column headerText="CORREO">
                            <h:outputText value="#{abogado.email()}"/>
                        </p:column>
                        <p:column headerText="TELEFONO">
                            <h:outputText value="#{abogado.phone()}"/>
                        </p:column>
                        <p:column headerText="ESPECIALIDAD">
                            <h:outputText value="#{abogado.specialty()}"/>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
