<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            Registro Evento
        </title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>
    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-eventos">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-eventos:tabla-eventos"
                                    actionListener="#{EventoVistaController.cargarDatos()}"/>
                    </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{eventoVistaController.eventos}" var="evento"
                                 id="tabla-eventos" widgetVar="eventosTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>Eventos</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="TIPO">
                            <h:outputText value="#{evento.type()}"/>
                        </p:column>
                        <p:column headerText="CASO">
                            <h:outputText value="#{evento.casoDto()}"/>
                        </p:column>
                        <p:column headerText="ABOGADO">
                            <h:outputText value="#{evento.abogadoDto()}"/>
                        </p:column>
                        <p:column headerText="HISTORIAL">
                            <h:outputText value="#{evento.historialDto()}"/>
                        </p:column>

                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
