<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            Registro Insumos
        </title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>
    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-insumos">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-insumos:tabla-insumos"
                                    actionListener="#{InsumoVistaController.cargarDatos()}"/>
                    </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{insumoVistaController.insumo}" var="insumo"
                                 id="tabla-insumos" widgetVar="insumosTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>Insumos</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="DESCRIPCION">
                            <h:outputText value="#{insumo.description()}"/>
                        </p:column>

                        <p:column headerText="CANTIDAD">
                            <h:outputText value="#{insumo.cuantity()}"/>
                        </p:column>

                        <p:column headerText="COSTO UNITARIO">
                            <h:outputText value="#{insumo.unitaryCost()}"/>
                        </p:column>

                        <p:column headerText="COSTO">
                            <h:outputText value="#{insumo.cost()}"/>
                        </p:column>

                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
