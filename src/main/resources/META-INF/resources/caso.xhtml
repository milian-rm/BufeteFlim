<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            Registro Caso
        </title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex/themes/primeone-light.css"/>
    </h:head>
    <h:body style="background-color: #F2F2F2;">
        <div class="card">
            <h:form id="formulario-casos">
                <p:growl id = "mensaje-emergente" showDetails="true"/>
                <div class="card">
                    <p:menubar style="background-color: #A7CCED;">
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-user"
                                    update=":formulario-casos:tabla-casos"
                                    actionListener="#{casoVistaController.cargarDatos()}"/>
                    </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{casoVistaController.casos}" var="caso"
                                 id="tabla-casos" widgetVar="casoTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap
                                        card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                        w-20rem h4rem  font-bold m-2
                                        text-gray-900 border-round"
                                     style="background-color: #82A0BC;">
                                    <h3>Casos</h3>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="TITULO">
                            <h:outputText value="#{caso.title()}"/>
                        </p:column>
                        <p:column headerText="DESCRIPCIÓN">
                            <h:outputText value="#{caso.description()}"/>
                        </p:column>
                        <p:column headerText="FECHA INICIO">
                            <h:outputText value="#{caso.startDate()}"/>
                        </p:column>
                        <p:column headerText="FECHA CIERRE">
                            <h:outputText value="#{caso.closingDate()}"/>
                        </p:column>
                        <p:column headerText="ESTADO">
                            <h:outputText value="#{caso.status()}"/>
                        </p:column>
                        <p:column headerText="TIPO de CASO">
                            <h:outputText value="#{caso.caseType()}"/>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
